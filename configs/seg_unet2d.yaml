# 2-D U-Net, TRACE+ADC. Change hyper-parameters HERE only (A4 rule).
# Values fixed by A4 on 2026-09-09 from measurements on 1x RTX A6000 (see docs/agents/A4_report.md).

# --- reproducibility -----------------------------------------------------------------------------
seed: 2026
threads: 4

# --- preprocessing (read by scripts/preprocess.py; the cache must be rebuilt when these change) ---
size: 128               # A4: 192 gave val Dice 0.6812 vs 0.6826 for 1.9x the epoch time -> no gain
clip: 10.0              # robust-sigma clip. 6 -> 10 raised val Dice 0.5950 -> 0.6826 (A3 F3 / A4 s.7.1).
                        # CHANGING THIS REQUIRES REBUILDING data/cache (scripts/preprocess.py).
clip_mode: mad          # "mad" = fixed sigma clip, "pct" = per-subject percentile clip

# --- model ---------------------------------------------------------------------------------------
base_channels: 16
depth: 4

# --- optimisation --------------------------------------------------------------------------------
epochs: 40             # val Dice plateaus at ~0.69 from epoch ~35; 60/100/150 add <= +0.010 Dice but
                       # cost volume ICC (0.914 -> 0.866 -> 0.857 -> 0.828). See A4 report s.10.1.
batch_size: 64
lr: 0.001
min_lr: 0.00002
warmup_frac: 0.05
weight_decay: 0.0001
grad_clip: 1.0          # fires on 20-30 % of steps in epochs 2-4, ~3 % over a 40-epoch run
                        # (NOT the 0 % the 40-subject CPU smoke test reported)
dice_weight: 1.0
dice_reduction: batch   # "batch" = one micro-Dice per batch, "sample" = mean of per-slice Dice
pos_weight: null
neg_pos_ratio: 1.0      # negatives sampled per positive slice each epoch (null = all slices)
augment: true
flip_axis: ap           # mirror augmentation axis. Cache is (S,C,H,W) with H = left-right, W = anterior-posterior
                        # (A5b 2026-09-09). The shipped run was trained with the W flip = "ap" (the code comment
                        # called it "left-right" but it was not). Options: lr | ap | both | none.
                        # A5b measured lr vs ap at 40 epochs x 3 seeds (docs/agents/A5b_report.md) before deciding.
threshold: 0.5

# --- small-lesion options (A4b 2026-09-09) --------------------------------------------------------
# All four keys are OMITTED here on purpose: their code defaults reproduce this file's behaviour
# exactly (runs/seg_unet2d must stay bit-reproducible), and A4b measured that none of them beats the
# seed noise of the < 2 mL band.  Set them in a separate config to re-run the experiment; see
# docs/agents/A4b_small_lesion_report.md and scripts/analysis/small_lesion_experiments.py.
#   slice_weight: none      # none | inv_subject | inv_volume | inv_area -- lesion-size-aware sampling
#                           # of the positive slices (default none = every positive slice once)
#   slice_weight_power: 1.0 # exponent of the inverse weight
#   context: 0              # 2.5-D: neighbouring slices per side stacked as channels (0 = plain 2-D)
#   context_mode: all       # all = every channel gets the neighbours (6 ch), trace = only channel 0 (4 ch)
#   region_loss: dice       # dice | tversky (tversky_alpha/beta/gamma weight FN vs FP)
#   dice_reduction: sample_invsize + invsize_power: per-slice Dice weighted by 1/lesion size

# --- runtime (GPU) -------------------------------------------------------------------------------
# amp: null | bf16 | fp16.  bf16 + channels_last is 2.1x the fp32 step rate and stays bit-reproducible.
amp: bf16
channels_last: true
pin_memory: true
cudnn_benchmark: false  # true costs reproducibility for ~2 % speed -> not worth it (charter)
num_workers: 8          # results are bit-identical for num_workers 0 / 8 / 16 (A3 fixed the RNG fork)
prefetch_factor: 4
log_every: 50
